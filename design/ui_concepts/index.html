<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touch Clock UI Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f3f0;
  --surface: #ffffff;
  --text: #16161a;
  --muted: #6b6b73;
  --line: #e2e0db;
  --chip: #ebe9e4;
  --chip-active: #16161a;
  --chip-active-text: #ffffff;
  --device: #0b0b0c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0f11;
    --surface: #17171a;
    --text: #f2f2f4;
    --muted: #9a9aa3;
    --line: #2a2a2f;
    --chip: #222226;
    --chip-active: #f2f2f4;
    --chip-active-text: #111114;
    --device: #000000;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0f11;
  --surface: #17171a;
  --text: #f2f2f4;
  --muted: #9a9aa3;
  --line: #2a2a2f;
  --chip: #222226;
  --chip-active: #f2f2f4;
  --chip-active-text: #111114;
  --device: #000000;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1320px; margin: 0 auto; padding: 56px 32px 96px; }
header h1 { font-size: 40px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 12px; font-weight: 700; }
header p { color: var(--muted); max-width: 680px; margin: 0; font-size: 17px; }
h2 { font-size: 22px; letter-spacing: -0.01em; margin: 64px 0 20px; font-weight: 600; }
.directions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: 40px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  text-decoration: none;
  color: inherit;
  transition: transform .15s ease, border-color .15s ease;
}
.card:hover { transform: translateY(-2px); border-color: var(--muted); }
.card .hero { display: flex; justify-content: center; padding: 8px 0; }
.card h3 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.card p { margin: 0; color: var(--muted); font-size: 15px; }
.card .open { font-size: 14px; font-weight: 600; }
.device {
  border-radius: 50%;
  background: var(--device);
  padding: 10px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 18px 40px rgba(0,0,0,.18);
  display: inline-block;
  line-height: 0;
}
.device img { border-radius: 50%; display: block; width: 100%; height: auto; }
.card .device { width: 100%; max-width: 300px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 0;
  background: var(--chip);
  color: var(--text);
  font: 500 14px/1 Inter, sans-serif;
  padding: 10px 14px;
  border-radius: 999px;
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--chip-active); color: var(--chip-active-text); }
.compare { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; margin-top: 28px; }
.compare figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.compare .device { width: 100%; max-width: 300px; }
.compare figcaption { font-size: 14px; color: var(--muted); }
.compare figcaption strong { color: var(--text); font-weight: 600; }
.missing {
  aspect-ratio: 1;
  width: 100%;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #6b6b73;
  font-size: 13px;
  background: #141416;
}
.zoom {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.86);
  display: none;
  place-items: center;
  z-index: 10;
  cursor: zoom-out;
}
.zoom.show { display: grid; }
.zoom .device { width: min(760px, 92vw); }
.compare img, .card img { cursor: zoom-in; }
@media (max-width: 760px) {
  .directions { grid-template-columns: minmax(0, 1fr); }
  .compare { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  .wrap { padding: 32px 16px 64px; }
  header h1 { font-size: 30px; }
  .compare { gap: 12px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Touch Clock — UI concepts</h1>
    <p>Three design directions for everything around the faces: sheets, settings, alarms and dialogs. Each screen is drawn at the device's real 720 × 720 round size, over your actual faces, within what LVGL can render smoothly on the clock.</p>
  </header>

  <div class="directions" id="directions"></div>

  <h2>Compare screen by screen</h2>
  <div class="chips" id="chips"></div>
  <div class="compare" id="compare"></div>
</div>
<div class="zoom" id="zoom"><div class="device"><img alt=""></div></div>
<script>
const directions = [
  { slug: "instrument", name: "Instrument", blurb: "Braun, Teenage Engineering and Leica: the clock as a precision instrument. Graphite, hairlines, one signal colour, controls that feel like hardware." },
  { slug: "orbit", name: "Orbit", blurb: "Round-native in the spirit of watchOS: pure black, big rounded platters, a tint per area, layouts that follow the circle." },
  { slug: "atelier", name: "Atelier", blurb: "Luxury horology: warm ink and champagne hairlines, serif numerals, chapter rings and arcs, set like a fine watch." },
];
const screens = [
  ["01", "Face controls", "thumb_face"],
  ["02", "Theme sheet", "thumb_theme_open"],
  ["03", "Quick actions", "thumb_brightness_open"],
  ["04", "Settings", "thumb_settings_root"],
  ["05", "Wi-Fi", "thumb_settings_wifi"],
  ["06", "Join network", null],
  ["07", "Night mode", "thumb_settings_night"],
  ["08", "Other", "thumb_settings_other"],
  ["09", "Alarms", "thumb_alarms"],
  ["10", "Alarm editor", "thumb_alarm_editor"],
  ["11", "Alarm ringing", null],
  ["12", "Night, active", null],
];

function device(src, alt) {
  const d = document.createElement("div");
  d.className = "device";
  const img = document.createElement("img");
  img.src = src;
  img.alt = alt;
  img.loading = "lazy";
  img.onerror = () => { d.replaceWith(Object.assign(document.createElement("div"), { className: "missing", textContent: "Not available" })); };
  img.addEventListener("click", (e) => { e.preventDefault(); openZoom(src, alt); });
  d.appendChild(img);
  return d;
}

const dirEl = document.getElementById("directions");
for (const dir of directions) {
  const a = document.createElement("a");
  a.className = "card";
  a.href = `${dir.slug}.html`;
  const hero = document.createElement("div");
  hero.className = "hero";
  hero.appendChild(device(`compare/${dir.slug}/03.png`, `${dir.name} quick actions`));
  a.append(hero,
    Object.assign(document.createElement("h3"), { textContent: dir.name }),
    Object.assign(document.createElement("p"), { textContent: dir.blurb }),
    Object.assign(document.createElement("span"), { className: "open", textContent: "Open the full presentation →" }));
  dirEl.appendChild(a);
}

const chipsEl = document.getElementById("chips");
const compareEl = document.getElementById("compare");
let current = "03";
try { current = localStorage.getItem("ui-concepts-screen") || current; } catch (e) {}

function render() {
  compareEl.replaceChildren();
  const [id, label, thumb] = screens.find((s) => s[0] === current);
  const cols = [["Current", thumb ? `current/${thumb}.png` : null]]
    .concat(directions.map((d) => [d.name, `compare/${d.slug}/${id}.png`]));
  for (const [name, src] of cols) {
    const fig = document.createElement("figure");
    fig.appendChild(src ? device(src, `${name} — ${label}`)
                        : Object.assign(document.createElement("div"), { className: "missing", textContent: "No current equivalent" }));
    const cap = document.createElement("figcaption");
    cap.innerHTML = `<strong>${name}</strong> · ${label}`;
    fig.appendChild(cap);
    compareEl.appendChild(fig);
  }
  for (const chip of chipsEl.children) chip.setAttribute("aria-pressed", String(chip.dataset.id === current));
}

for (const [id, label] of screens) {
  const b = document.createElement("button");
  b.className = "chip";
  b.dataset.id = id;
  b.textContent = label;
  b.addEventListener("click", () => {
    current = id;
    try { localStorage.setItem("ui-concepts-screen", id); } catch (e) {}
    render();
  });
  chipsEl.appendChild(b);
}
render();

const zoom = document.getElementById("zoom");
function openZoom(src, alt) {
  const img = zoom.querySelector("img");
  img.src = src;
  img.alt = alt;
  zoom.classList.add("show");
}
zoom.addEventListener("click", () => zoom.classList.remove("show"));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") zoom.classList.remove("show"); });
</script>
</body>
</html>
