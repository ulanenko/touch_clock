name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sanitizers: a bool read from a 0xFF byte passed on macOS's clang and failed here.
      - name: Run host tests
        run: |
          cmake -S tests/host -B /tmp/touch_clock_host_tests \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build /tmp/touch_clock_host_tests
          ctest --test-dir /tmp/touch_clock_host_tests --output-on-failure

  firmware-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build

      # The simulator (sim/) on the components and sdkconfig the build above made, under
      # sanitizers: a few scenarios through every area must run to the end with every shot,
      # and nothing of ours may trip ASan or UBSan (LVGL's own reports are left to LVGL).
      - name: Simulator smoke test
        shell: bash
        run: |
          apt-get update -qq && apt-get install -y -qq cmake gcc make python3 zlib1g-dev
          cmake -S sim -B /tmp/sim -DSIM_ASAN=ON \
            -DLVGL_DIR="$PWD/managed_components/lvgl__lvgl" -DSDKCONFIG="$PWD/sdkconfig"
          cmake --build /tmp/sim -j"$(nproc)"
          for scenario in smoke settings_screens alarms_orbit; do
            expected=$(grep -c '^shot ' "sim/scenarios/$scenario.txt")
            mkdir -p "/tmp/shots/$scenario"
            /tmp/sim/sim "sim/scenarios/$scenario.txt" "/tmp/shots/$scenario" > "/tmp/$scenario.log" 2>&1 \
              || { tail -40 "/tmp/$scenario.log"; exit 1; }
            shots=$(ls "/tmp/shots/$scenario" | wc -l)
            ours=$(grep -E 'ERROR: AddressSanitizer|runtime error' "/tmp/$scenario.log" | grep -v managed_components || true)
            echo "$scenario: $shots of $expected shots"
            if [ "$shots" -ne "$expected" ] || [ -n "$ours" ]; then
              echo "$ours"; tail -40 "/tmp/$scenario.log"; exit 1
            fi
          done
